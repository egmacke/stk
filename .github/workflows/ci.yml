name: ci

on:
  push:
    branches: [main]
  pull_request:
    # Re-check the title when it is edited, not only when code is pushed.
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: true
      - name: git identity
        run: |
          git config --global user.name "ci"
          git config --global user.email "ci@example.invalid"
          git config --global init.defaultBranch main
      - run: make lint
      - run: make test

  # Pull requests are squash-merged, so the title becomes the commit message on
  # main, and that message is what release-please reads to decide the next
  # version and write the changelog. A title it cannot parse does not fail --
  # it silently drops the change from the release notes -- so it is checked
  # here instead.
  title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            build
            ci
            chore
            revert
            style
          requireScope: false
          subjectPattern: ^[a-z].*[^.]$
          subjectPatternError: |
            The subject "{subject}" of pull request title "{title}" is invalid:
            it must start with a lower-case letter and must not end with a full stop.
